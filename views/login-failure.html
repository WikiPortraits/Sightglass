<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="/styles/error.css" />
  </head>
  <body>
    {{header}}
    <main class="container">

    </main>

    <script src="/common.js"></script>
    <script src="/info.js"></script>

</html>
